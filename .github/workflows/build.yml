name: Build MediaGrab

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  # ---------------------------------------------------------------------------
  # Analyze + unit tests
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold native platform folders
        run: flutter create --platforms=android --org com.mediagrab --project-name media_grab .
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter test

  # ---------------------------------------------------------------------------
  # Android APK (+ App Bundle)
  # ---------------------------------------------------------------------------
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Android project
        run: flutter create --platforms=android --org com.mediagrab --project-name media_grab .
      - name: Patch Android project (permissions + desugaring)
        run: bash tool/patch_android.sh
      - run: flutter pub get
      - name: Build APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Build universal APK
        run: flutter build apk --release
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediagrab-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows desktop build
  # ---------------------------------------------------------------------------
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Windows project
        run: flutter create --platforms=windows --org com.mediagrab --project-name media_grab .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mediagrab-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mediagrab-windows
          path: mediagrab-windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with the installable files on version tags
  # ---------------------------------------------------------------------------
  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
