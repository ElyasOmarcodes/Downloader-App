name: Build MediaGrab

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # 3.27.x reliably detects Visual Studio 2022 on the windows-latest runner
  # (3.24.x fell back to the missing "VS 16 2019" generator).
  FLUTTER_VERSION: "3.27.4"

jobs:
  # ---------------------------------------------------------------------------
  # Analyze + unit tests (fast gate — fails on real compile errors)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold native platform folders
        run: flutter create --platforms=android --org com.mediagrab --project-name media_grab .
      - run: flutter pub get
      # Fail on ERROR-severity issues only, so real compile errors are caught
      # here (cheaply) before the slow platform builds run.
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test

  # ---------------------------------------------------------------------------
  # Android APK (+ App Bundle)
  # ---------------------------------------------------------------------------
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Android project
        run: flutter create --platforms=android --org com.mediagrab --project-name media_grab .
      - name: Patch Android project (permissions + desugaring)
        run: bash tool/patch_android.sh
      - run: flutter pub get
      - name: Build APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Build universal APK
        run: flutter build apk --release
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediagrab-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS (unsigned .ipa — installable via AltStore / Sideloadly, no Apple account)
  # ---------------------------------------------------------------------------
  ios:
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold iOS project
        run: flutter create --platforms=ios --org com.mediagrab --project-name media_grab .
      - run: flutter pub get
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r mediagrab-unsigned.ipa Payload >/dev/null
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediagrab-ios
          path: build/ios/iphoneos/mediagrab-unsigned.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows desktop build
  # ---------------------------------------------------------------------------
  windows:
    needs: test
    runs-on: windows-latest
    # Non-fatal: desktop builds depend on the runner's Visual Studio toolchain
    # and must never block the Android APK, iOS build, or the release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Scaffold Windows project
        run: flutter create --platforms=windows --org com.mediagrab --project-name media_grab .
      - run: flutter pub get
      - name: Diagnose toolchain
        run: flutter doctor -v
      - run: flutter build windows --release
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mediagrab-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mediagrab-windows
          path: mediagrab-windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with the installable files on version tags
  # ---------------------------------------------------------------------------
  release:
    needs: [android, ios, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
