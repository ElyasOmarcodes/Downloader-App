name: media_grab
description: A fast, cross-platform video & audio downloader built with Flutter.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Network type (WiFi vs mobile) for adaptive concurrency
  connectivity_plus: ^6.0.5

  # Receive links shared from other apps
  receive_sharing_intent: ^1.8.0

  # Networking & downloads
  dio: ^5.4.3+1
  http: ^1.2.1

  # Media extraction (YouTube). Other platforms use a pluggable resolver.
  youtube_explode_dart: ^2.2.1

  # Filesystem & permissions
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  open_filex: ^4.4.0

  # Persistence
  shared_preferences: ^2.2.3

  # Notifications (download progress)
  flutter_local_notifications: ^17.1.2

  # Utilities
  intl: ^0.19.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
